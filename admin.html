<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>동아리 캘린더 — 관리자</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title">캘린더 관리자</h1>
  </header>

  <section class="auth-section">
    <div id="sign-in-button"></div>
    <span id="user-label" class="auth-section__user"></span>
    <button id="sign-out-button" type="button" class="auth-section__sign-out" hidden>로그아웃</button>
    <p id="auth-error" class="auth-error" role="alert" hidden></p>
  </section>

  <main id="admin-panel" class="admin-panel" hidden>
    <form id="event-form" class="event-form">
      <h2 id="form-mode" class="event-form__mode">새 일정 등록</h2>

      <fieldset class="event-form__type">
        <legend>일정 종류</legend>
        <label><input type="radio" name="eventType" value="band" checked /> 합주</label>
        <label><input type="radio" name="eventType" value="lesson" /> 레슨</label>
        <label><input type="radio" name="eventType" value="common" /> 공통 일정</label>
      </fieldset>

      <div id="team-field" class="event-form__field">
        <label for="team-select">밴드팀</label>
        <select id="team-select"></select>
        <p id="weekly-count-label" class="weekly-count-label"></p>
      </div>

      <div id="part-field" class="event-form__field" hidden>
        <label for="part-select">파트</label>
        <select id="part-select"></select>
      </div>

      <div id="common-title-field" class="event-form__field" hidden>
        <label for="title-input">일정 제목</label>
        <input id="title-input" type="text" placeholder="예: 정기 공연" />
      </div>

      <div class="event-form__field">
        <label for="date-input">날짜</label>
        <input id="date-input" type="date" required />
      </div>

      <div class="event-form__field">
        <label><input id="all-day-input" type="checkbox" /> 종일</label>
      </div>

      <div id="start-time-field" class="event-form__field">
        <label for="start-time-input">시작 시간</label>
        <input id="start-time-input" type="time" />
      </div>

      <div id="end-time-field" class="event-form__field">
        <label for="end-time-input">종료 시간</label>
        <input id="end-time-input" type="time" />
      </div>

      <div class="event-form__field">
        <label for="description-input">설명 (선택)</label>
        <textarea id="description-input" rows="2"></textarea>
      </div>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <div class="event-form__actions">
        <button id="submit-button" type="submit">등록</button>
        <button id="cancel-edit-button" type="button" hidden>수정 취소</button>
      </div>
    </form>

    <section class="admin-event-list-section">
      <h2>다가오는 일정 (60일)</h2>
      <ul id="event-list" class="admin-event-list"></ul>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
