<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>동아리 캘린더</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title">동아리 캘린더</h1>
    <div class="app-header__legend" aria-hidden="true">
      <span class="legend-item"><span class="legend-item__badge" data-event-type="band">합</span>합주</span>
      <span class="legend-item"><span class="legend-item__badge" data-event-type="lesson">레</span>레슨</span>
      <span class="legend-item"><span class="legend-item__badge" data-event-type="common">공</span>공통 일정</span>
    </div>
  </header>

  <nav class="toolbar" aria-label="캘린더 보기 전환/이동">
    <div class="toolbar__tabs" role="tablist" aria-label="월간/주간 보기">
      <button id="tab-month" type="button" role="tab" aria-selected="true" class="toolbar__tab">월간</button>
      <button id="tab-week" type="button" role="tab" aria-selected="false" class="toolbar__tab">주간</button>
    </div>
    <div class="toolbar__nav">
      <button id="prev-button" type="button" class="toolbar__nav-button" aria-label="이전">‹</button>
      <button id="today-button" type="button" class="toolbar__today-button">오늘</button>
      <button id="next-button" type="button" class="toolbar__nav-button" aria-label="다음">›</button>
    </div>
    <div id="view-label" class="toolbar__label" aria-live="polite"></div>
  </nav>

  <p id="status-region" class="status-region" role="status" aria-live="polite" hidden></p>

  <div id="error-region" class="error-region" role="alert" hidden>
    <span class="error-region__message"></span>
    <button id="retry-button" type="button" class="error-region__retry">다시 시도</button>
  </div>

  <main class="calendar-main">
    <div id="month-grid" class="month-grid"></div>
    <div id="week-grid" class="week-grid" hidden></div>
    <aside id="day-detail" class="day-detail" aria-label="선택한 날짜 상세 일정"></aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
